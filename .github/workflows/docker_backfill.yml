name: Docker Backfill

on:
  pull_request:
    paths:
      - Dockerfile.backfill
      - Dockerfile.backfill.dockerignore
      - docker/backfill/**
      - packages/db/scripts/**
      - packages/db/prisma/schema/**
      - .github/workflows/docker_backfill.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.backfill
      - Dockerfile.backfill.dockerignore
      - docker/backfill/**
      - packages/db/scripts/**
      - packages/db/prisma/schema/**
      - .github/workflows/docker_backfill.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build smoke image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.backfill
          load: true
          tags: blobscan-backfill:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check runtime
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges blobscan-backfill:smoke --help
          docker run --rm --read-only --entrypoint node blobscan-backfill:smoke -e 'const { PrismaClient } = require("@prisma/client"); const client = new PrismaClient(); client.$disconnect();'
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.backfill
          push: true
          tags: |
            blossomlabs/blobscan-backfill:${{ github.sha }}
          cache-from: type=gha
