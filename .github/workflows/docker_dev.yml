name: Docker dev

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types:
      - completed

env:
  FORCE_COLOR: 3
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  release_docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build docker images (API, Web)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: blobscan_dev
          POSTGRES_USER: blobscan
          POSTGRES_PASSWORD: s3cr3t
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Setup
        uses: ./tooling/github/setup

      - name: Setup DB
        uses: ./tooling/github/setup-db
        with:
          export-env: "true"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Github ENV variables
        shell: bash
        run: |
          {
            echo "BUILD_TIMESTAMP=$(date '+%F %H:%M:%S')"
            echo "GIT_COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Build (smoke, api)
        uses: ./tooling/github/docker-build
        with:
          target: api
          tags: blobscan-api:smoke

      - name: Create an empty database (api)
        run: |
          docker run --rm --network host -e PGPASSWORD=s3cr3t postgres:17-alpine \
            psql -h 127.0.0.1 -U blobscan -d blobscan_dev -c 'CREATE DATABASE blobscan_smoke_api'

      - name: Smoke test (api)
        uses: ./tooling/github/docker-smoke
        with:
          target: api
          image: blobscan-api:smoke
          database-url: postgresql://blobscan:s3cr3t@127.0.0.1:5432/blobscan_smoke_api

      - name: Build (smoke, web)
        uses: ./tooling/github/docker-build
        with:
          target: web
          tags: blobscan-web:smoke

      - name: Create an empty database (web)
        run: |
          docker run --rm --network host -e PGPASSWORD=s3cr3t postgres:17-alpine \
            psql -h 127.0.0.1 -U blobscan -d blobscan_dev -c 'CREATE DATABASE blobscan_smoke_web'

      - name: Smoke test (web)
        uses: ./tooling/github/docker-smoke
        with:
          target: web
          image: blobscan-web:smoke
          database-url: postgresql://blobscan:s3cr3t@127.0.0.1:5432/blobscan_smoke_web

      - name: Trivy scan (api)
        uses: ./tooling/github/trivy-scan
        with:
          image: blobscan-api:smoke

      - name: Build and push (api)
        uses: ./tooling/github/docker-build
        with:
          target: api
          tags: |
            blossomlabs/blobscan-api:development
          push: "true"

      - name: Trivy scan (web)
        uses: ./tooling/github/trivy-scan
        with:
          image: blobscan-web:smoke

      - name: Build and push (web)
        uses: ./tooling/github/docker-build
        with:
          target: web
          tags: |
            blossomlabs/blobscan-web:development
          push: "true"

  release_dagster_docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build docker image (Dagster)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Github ENV variables
        shell: bash
        run: |
          {
            echo "BUILD_TIMESTAMP=$(date '+%F %H:%M:%S')"
            echo "GIT_COMMIT=$(git rev-parse HEAD)"
            echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_ENV"

      # sha-<commit> never moves, so a deployment can pin it and only update
      # when told to. :development moves on every merge to main.
      - name: Build (scan, dagster)
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./apps/dagster
          push: false
          load: true
          tags: blobscan-dagster:scan
          cache-from: type=gha,scope=dagster
          build-args: |
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}

      - name: Trivy scan (dagster)
        uses: ./tooling/github/trivy-scan
        with:
          image: blobscan-dagster:scan

      - name: Build and push (dagster)
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./apps/dagster
          push: true
          tags: |
            blossomlabs/blobscan-dagster:development
            blossomlabs/blobscan-dagster:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=dagster
          cache-to: type=gha,scope=dagster,mode=max
          build-args: |
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}
