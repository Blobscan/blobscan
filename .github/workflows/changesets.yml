name: Changesets

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types:
      - completed

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # for the release commits and tags
  pull-requests: write # for the version pull request

jobs:
  changesets:
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: blobscan_dev
          POSTGRES_USER: blobscan
          POSTGRES_PASSWORD: s3cr3t
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    name: Create pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Setup
        uses: ./tooling/github/setup

      - name: Setup DB
        uses: ./tooling/github/setup-db
        with:
          export-env: "true"

      - name: Create version pull request
        id: changesets
        uses: changesets/action@v2
        with:
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:release
