name: Docker

on:
  push:
    tags: ["v*"]

env:
  FORCE_COLOR: 3
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  release_docker:
    name: Build docker images (API, Web)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: blobscan_dev
          POSTGRES_USER: blobscan
          POSTGRES_PASSWORD: s3cr3t
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Setup
        uses: ./tooling/github/setup

      - name: Setup DB
        uses: ./tooling/github/setup-db
        with:
          export-env: "true"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Github ENV variables
        shell: bash
        run: |
          {
            echo "BUILD_TIMESTAMP=$(date '+%F %H:%M:%S')"
            echo "GIT_COMMIT=$(git rev-parse HEAD)"
            echo "NEXT_PUBLIC_BLOBSCAN_RELEASE=$(git describe --tags)"
          } >> "$GITHUB_ENV"

      - name: Extract metadata (tags, labels) for Docker (API)
        id: meta_api
        uses: docker/metadata-action@v6
        with:
          images: |
            blossomlabs/blobscan-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build (scan, api)
        uses: ./tooling/github/docker-build
        with:
          target: api
          tags: blobscan-api:scan

      - name: Trivy scan (api)
        uses: ./tooling/github/trivy-scan
        with:
          image: blobscan-api:scan

      - name: Build and push (api)
        uses: ./tooling/github/docker-build
        with:
          target: api
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          push: "true"

      - name: Extract metadata (tags, labels) for Docker (Web)
        id: meta_web
        uses: docker/metadata-action@v6
        with:
          images: |
            blossomlabs/blobscan-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build (scan, web)
        uses: ./tooling/github/docker-build
        with:
          target: web
          tags: blobscan-web:scan

      - name: Trivy scan (web)
        uses: ./tooling/github/trivy-scan
        with:
          image: blobscan-web:scan

      - name: Build and push (web)
        uses: ./tooling/github/docker-build
        with:
          target: web
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          push: "true"

  release_dagster_docker:
    name: Build docker image (Dagster)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Github ENV variables
        shell: bash
        run: |
          echo "BUILD_TIMESTAMP=$(date '+%F %H:%M:%S')" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Extract metadata (tags, labels) for Docker (Dagster)
        id: meta_dagster
        uses: docker/metadata-action@v6
        with:
          images: |
            blossomlabs/blobscan-dagster
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build (scan, dagster)
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./apps/dagster
          push: false
          load: true
          tags: blobscan-dagster:scan
          cache-from: type=gha,scope=dagster
          build-args: |
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}

      - name: Trivy scan (dagster)
        uses: ./tooling/github/trivy-scan
        with:
          image: blobscan-dagster:scan

      - name: Build and push (dagster)
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./apps/dagster
          push: true
          tags: ${{ steps.meta_dagster.outputs.tags }}
          labels: ${{ steps.meta_dagster.outputs.labels }}
          cache-from: type=gha,scope=dagster
          cache-to: type=gha,scope=dagster,mode=max
          build-args: |
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}
