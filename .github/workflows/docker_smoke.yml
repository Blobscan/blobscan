name: Docker smoke

# Builds the web and api images and starts them against a real Postgres (see
# tooling/github/docker-smoke). Docker dev runs the same check before it publishes `:development`.

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/db/**
      - scripts/prisma-cli-closure.mjs
      - apps/rest-api-server/**
      - apps/web/**
      - tooling/github/docker-smoke/**
      - .github/workflows/docker_smoke.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Start the ${{ matrix.target }} image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: blobscan
          POSTGRES_DB: blobscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6.5.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: blobscan-${{ matrix.target }}:smoke
          cache-from: type=gha,scope=smoke-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.target }}

      - name: Smoke test
        uses: ./tooling/github/docker-smoke
        with:
          target: ${{ matrix.target }}
          image: blobscan-${{ matrix.target }}:smoke
          database-url: postgresql://postgres:blobscan@127.0.0.1:5432/blobscan
