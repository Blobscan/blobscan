name: "Set up DB"
description: "Set up the database for the CI environment"
runs:
  using: "composite"
  steps:
    - name: "Create .env file with db connection"
      shell: bash
      run: |
        cat > "$GITHUB_WORKSPACE/.env" <<'EOF'
        DATABASE_URL=postgresql://blobscan:s3cr3t@localhost:5432/blobscan_dev?schema=public
        DIRECT_URL=postgresql://blobscan:s3cr3t@localhost:5432/blobscan_dev?schema=public
        EOF
    - name: "Apply Prisma migrations to db"
      shell: bash
      working-directory: packages/db
      run: pnpm with-env prisma migrate deploy
