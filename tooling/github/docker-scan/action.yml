name: "Docker scan"
description: >-
  Vulnerability gate: scan a built image with Trivy before it is pushed. Only HIGH and CRITICAL
  CVEs with a fix available are reported. Accepted risks go in .trivyignore.
inputs:
  image:
    description: "Image to scan; it must be loaded in the local Docker daemon"
    required: true
runs:
  using: "composite"
  steps:
    # TEMPORARY: the gate is not blocking. Vulnerabilities are reported and the image is still
    # pushed. Restore the gate by removing `continue-on-error`.
    - name: "Trivy scan"
      uses: aquasecurity/trivy-action@v0.36.0
      continue-on-error: true
      with:
        version: v0.76.1
        image-ref: ${{ inputs.image }}
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        trivyignores: .trivyignore
        exit-code: "1"
