name: "Setup and install"
description: "Common setup steps for Actions"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: true

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: "pnpm"

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - shell: bash
      run: pnpm add -g turbo
